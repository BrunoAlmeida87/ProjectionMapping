<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="Inter, Arial, sans-serif">
  <rect width="1080" height="560" fill="#fff"/>
  <style>.b{stroke-width:1.6px}.t{font-size:13.5px;font-weight:700;fill:#111827}.s{font-size:11.5px;fill:#4b5563}.h{font-size:12.5px;font-weight:800;letter-spacing:.06em}</style>
  <text x="20" y="28" class="h" fill="#7c5cff">INTERFACE</text>
  <rect x="20" y="38" width="1040" height="110" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
  <g>
    <rect class="b" rx="10" x="36" y="52" width="190" height="82" fill="#fff" stroke="#7c5cff"/><text class="t" x="50" y="76">editor.js</text><text class="s" x="50" y="96">desenhar, arrastar vértices,</text><text class="s" x="50" y="112">gestos, zoom, ímã, lupa</text>
    <rect class="b" rx="10" x="240" y="52" width="190" height="82" fill="#fff" stroke="#7c5cff"/><text class="t" x="254" y="76">panels.js</text><text class="s" x="254" y="96">camadas, biblioteca de</text><text class="s" x="254" y="112">efeitos, mídia</text>
    <rect class="b" rx="10" x="444" y="52" width="190" height="82" fill="#fff" stroke="#7c5cff"/><text class="t" x="458" y="76">inspector.js</text><text class="s" x="458" y="96">painel de propriedades</text><text class="s" x="458" y="112">(posição, conteúdo, cor…)</text>
    <rect class="b" rx="10" x="648" y="52" width="190" height="82" fill="#fff" stroke="#7c5cff"/><text class="t" x="662" y="76">timeline.js</text><text class="s" x="662" y="96">clipes, keyframes,</text><text class="s" x="662" y="112">agulha, transporte</text>
    <rect class="b" rx="10" x="852" y="52" width="192" height="82" fill="#fff" stroke="#7c5cff"/><text class="t" x="866" y="76">calibration.js · ui.js</text><text class="s" x="866" y="96">assistente, padrões,</text><text class="s" x="866" y="112">ícones, janelas, avisos</text>
  </g>
  <text x="20" y="182" class="h" fill="#be185d">ORQUESTRAÇÃO</text>
  <rect x="300" y="192" width="480" height="70" rx="35" fill="#111827"/>
  <text x="540" y="222" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">app.js</text>
  <text x="540" y="244" text-anchor="middle" font-size="12" fill="#f9a8d4">liga tudo: loop de quadros, ações, atalhos, salvamento automático</text>
  <text x="20" y="298" class="h" fill="#0891b2">DADOS E TEMPO</text>
  <rect x="20" y="308" width="510" height="110" rx="12" fill="#ecfeff" stroke="#a5f3fc"/>
  <g>
    <rect class="b" rx="10" x="36" y="322" width="150" height="82" fill="#fff" stroke="#0891b2"/><text class="t" x="50" y="346">state.js</text><text class="s" x="50" y="366">projeto, clipes,</text><text class="s" x="50" y="382">keyframes, desfazer</text>
    <rect class="b" rx="10" x="198" y="322" width="150" height="82" fill="#fff" stroke="#0891b2"/><text class="t" x="212" y="346">transport.js</text><text class="s" x="212" y="366">relógio: tocar,</text><text class="s" x="212" y="382">pausar, loop</text>
    <rect class="b" rx="10" x="360" y="322" width="156" height="82" fill="#fff" stroke="#0891b2"/><text class="t" x="374" y="346">storage.js</text><text class="s" x="374" y="366">IndexedDB: projetos</text><text class="s" x="374" y="382">e mídias no aparelho</text>
  </g>
  <text x="550" y="298" class="h" fill="#16a34a">IMAGEM (GPU)</text>
  <rect x="550" y="308" width="510" height="110" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <g>
    <rect class="b" rx="10" x="566" y="322" width="150" height="82" fill="#fff" stroke="#16a34a"/><text class="t" x="580" y="346">mapping.js</text><text class="s" x="580" y="366">homografia, malha,</text><text class="s" x="580" y="382">triangulação</text>
    <rect class="b" rx="10" x="728" y="322" width="150" height="82" fill="#fff" stroke="#16a34a"/><text class="t" x="742" y="346">renderer.js</text><text class="s" x="742" y="366">desenha tudo com</text><text class="s" x="742" y="382">WebGL (gl.js)</text>
    <rect class="b" rx="10" x="890" y="322" width="154" height="82" fill="#fff" stroke="#16a34a"/><text class="t" x="904" y="346">shaders/ · effects.js</text><text class="s" x="904" y="366">23 efeitos GLSL</text><text class="s" x="904" y="382">e seus parâmetros</text>
  </g>
  <text x="20" y="452" class="h" fill="#d97706">ENTRADAS E SAÍDAS</text>
  <rect x="20" y="462" width="1040" height="86" rx="12" fill="#fffbeb" stroke="#fde68a"/>
  <g>
    <rect class="b" rx="10" x="36" y="474" width="190" height="62" fill="#fff" stroke="#d97706"/><text class="t" x="50" y="498">media.js · audio.js</text><text class="s" x="50" y="518">arquivos, vídeo, GIF, som</text>
    <rect class="b" rx="10" x="240" y="474" width="250" height="62" fill="#fff" stroke="#d97706"/><text class="t" x="254" y="498">projector.js · sync.js → output.js</text><text class="s" x="254" y="518">janela do projetor sincronizada</text>
    <rect class="b" rx="10" x="504" y="474" width="170" height="62" fill="#fff" stroke="#d97706"/><text class="t" x="518" y="498">recorder.js</text><text class="s" x="518" y="518">gravar vídeo</text>
    <rect class="b" rx="10" x="688" y="474" width="170" height="62" fill="#fff" stroke="#d97706"/><text class="t" x="702" y="498">demo.js · room.js</text><text class="s" x="702" y="518">sala 3D e as 7 cenas</text>
    <rect class="b" rx="10" x="872" y="474" width="172" height="62" fill="#fff" stroke="#d97706"/><text class="t" x="886" y="498">sw.js · manifest</text><text class="s" x="886" y="518">app instalável/offline</text>
  </g>
  <g stroke="#9ca3af" stroke-width="2" fill="none">
    <path d="M540 148 V192"/><path d="M420 262 V308"/><path d="M660 262 V308"/><path d="M540 262 C540 420 540 430 540 462"/>
  </g>
</svg>
