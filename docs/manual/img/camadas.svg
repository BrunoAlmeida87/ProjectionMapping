<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" font-family="Inter, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  <pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#111"/><line x1="0" y1="0" x2="0" y2="10" stroke="#ff4d6d" stroke-width="3"/></pattern>
  <linearGradient id="gal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset=".5" stop-color="#4338ca"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
  <linearGradient id="wat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#0e7490"/></linearGradient></defs>
  <rect width="1080" height="360" fill="#fff"/>
  <text x="250" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Lista de camadas (de baixo para cima)</text>
  <g font-size="14" fill="#111827">
    <g transform="translate(70,250) skewX(-25)"><rect width="300" height="70" rx="8" fill="url(#gal)"/></g>
    <text x="395" y="280" font-weight="700">1. Parede</text><text x="395" y="300" font-size="12.5" fill="#4b5563">efeito Galáxia · desenhada primeiro</text>
    <g transform="translate(70,170) skewX(-25)"><rect x="40" y="0" width="120" height="70" rx="8" fill="url(#h)" opacity=".9"/></g>
    <text x="395" y="200" font-weight="700">2. Máscara do armário</text><text x="395" y="220" font-size="12.5" fill="#4b5563">pinta de preto o que está abaixo</text>
    <g transform="translate(70,90) skewX(-25)"><rect x="40" y="0" width="120" height="70" rx="8" fill="url(#wat)"/></g>
    <text x="395" y="120" font-weight="700">3. Armário</text><text x="395" y="140" font-size="12.5" fill="#4b5563">efeito Água · desenhado por cima</text>
  </g>
  <path d="M40 300 V95" stroke="#6b7280" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="30" y="200" font-size="12" fill="#6b7280" transform="rotate(-90 30 200)" text-anchor="middle">ordem de desenho</text>
  <text x="900" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Resultado no projetor</text>
  <rect x="770" y="60" width="260" height="250" rx="8" fill="url(#gal)"/>
  <rect x="820" y="130" width="95" height="170" fill="#000"/>
  <rect x="820" y="130" width="80" height="170" fill="url(#wat)"/>
  <text x="900" y="336" text-anchor="middle" font-size="12.5" fill="#4b5563">A galáxia não "vaza" na lateral do armário (preto = sem luz)</text>
</svg>
