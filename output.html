<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LuzMap — Saída do projetor</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <style>
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #e6e8ee; font: 14px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #000; }
    #hud { position: fixed; left: 50%; top: 16px; transform: translate(-50%, -10px); display: flex; gap: 8px; align-items: center; padding: 8px 10px 8px 14px; border-radius: 999px; background: #0b0d12e6; border: 1px solid #ffffff26; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; max-width: calc(100% - 24px); }
    body.show-hud #hud { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    #status { font-size: 12px; color: #aab2c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #hud button { background: #1d2230; color: #fff; border: 1px solid #323a4b; border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 12px; white-space: nowrap; }
    #hud button:hover { border-color: #22d3ee; }
    #hint { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: #fff; cursor: pointer; }
    #hint span { display: flex; flex-direction: column; gap: 6px; align-items: center; padding: 18px 26px; border-radius: 16px; background: #0b0d12d9; border: 1px solid #22d3ee66; text-align: center; }
    #hint small { color: #9aa3b5; }
  </style>
</head>
<body>
  <canvas id="out" aria-label="Saída do projetor"></canvas>
  <button id="hint" type="button"><span><strong>Clique para ativar a tela cheia</strong><small>Mova esta janela para a tela do projetor antes · F = tela cheia · duplo clique também funciona</small></span></button>
  <div id="hud">
    <span id="status">Conectando…</span>
    <button id="btn-fs" type="button">Tela cheia (F)</button>
    <button id="btn-fit" type="button">Ajuste</button>
    <button id="btn-close" type="button">Fechar</button>
  </div>
  <script type="module" src="js/output.js"></script>
</body>
</html>
