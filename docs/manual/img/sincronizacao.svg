<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" font-family="Inter, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cff"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker></defs>
  <rect width="1080" height="400" fill="#fff"/>
  <g font-size="13" fill="#5b21b6" text-anchor="middle">
    <text x="540" y="24" font-weight="800">editor → saída</text>
    <text x="540" y="44">project (geometria e conteúdos) · transport (tempo) · session (calibração, blackout)</text>
    <text x="540" y="62">media (arquivos sob pedido) · audio (níveis para efeitos reativos)</text>
  </g>
  <rect x="20" y="85" width="290" height="230" rx="14" fill="#f5f3ff" stroke="#7c5cff" stroke-width="2"/>
  <text x="165" y="117" text-anchor="middle" font-size="17" font-weight="800" fill="#111827">Janela do EDITOR</text>
  <text x="165" y="139" text-anchor="middle" font-size="12.5" fill="#4b5563">index.html · tela do notebook</text>
  <g font-size="13" fill="#111827"><text x="42" y="175">• você edita o projeto</text><text x="42" y="199">• toca o áudio (sem eco)</text><text x="42" y="223">• guarda as mídias (IndexedDB)</text><text x="42" y="247">• relógio principal da timeline</text></g>
  <rect x="770" y="85" width="290" height="230" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="915" y="117" text-anchor="middle" font-size="17" font-weight="800" fill="#111827">Janela de SAÍDA</text>
  <text x="915" y="139" text-anchor="middle" font-size="12.5" fill="#4b5563">output.html · tela do projetor</text>
  <g font-size="13" fill="#111827"><text x="792" y="175">• desenha só a composição</text><text x="792" y="199">• tela cheia + tela sempre ligada</text><text x="792" y="223">• segue o relógio do editor</text><text x="792" y="247">• vídeos ressincronizados se</text><text x="804" y="265">atrasarem mais de 0,35 s</text></g>
  <rect x="410" y="160" width="260" height="80" rx="40" fill="#111827"/>
  <text x="540" y="195" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">BroadcastChannel</text>
  <text x="540" y="217" text-anchor="middle" font-size="12" fill="#c4b5fd">canal do navegador entre janelas</text>
  <path d="M312 140 C 360 140, 380 170, 408 178" stroke="#7c5cff" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M672 178 C 700 170, 720 140, 768 140" stroke="#7c5cff" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M768 270 C 720 270, 700 240, 672 225" stroke="#0891b2" stroke-width="2.5" fill="none" marker-end="url(#b)"/>
  <path d="M408 225 C 380 240, 360 270, 312 270" stroke="#0891b2" stroke-width="2.5" fill="none" marker-end="url(#b)"/>
  <g font-size="13" fill="#0e7490" text-anchor="middle">
    <text x="540" y="345" font-weight="800">saída → editor</text>
    <text x="540" y="365">hello (acabei de abrir) · status (resolução, tela cheia, fps) · needMedia (me envie este arquivo)</text>
  </g>
  <text x="540" y="392" text-anchor="middle" font-size="12" fill="#6b7280">Sem servidor: as mensagens nunca saem do computador.</text>
</svg>
